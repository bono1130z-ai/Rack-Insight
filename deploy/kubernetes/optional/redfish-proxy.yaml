# OPTIONAL — NOT part of the default kustomize build.
#
# The redfish-proxy is a development helper: a TLS-terminating nginx shim in
# front of a (mock) Redfish endpoint. In docker-compose it targets
# host.docker.internal:8001 and reads local, git-ignored certs — neither of
# which works in Kubernetes. This manifest is a template for teams that want a
# Redfish TLS proxy inside the cluster. It is intentionally excluded from
# base/kustomization.yaml so the core stack never depends on it.
#
# To use it:
#   1) Create the TLS secret (certs are NEVER committed):
#        kubectl -n rack-insight create secret tls redfish-proxy-tls \
#          --cert=cert.pem --key=key.pem
#   2) Edit REDFISH_UPSTREAM in the ConfigMap below to your Redfish endpoint
#      (a Service DNS name inside the cluster, not host.docker.internal).
#   3) kubectl apply -n rack-insight -f deploy/kubernetes/optional/redfish-proxy.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: redfish-proxy-nginx
  labels:
    app.kubernetes.io/name: redfish-proxy
    app.kubernetes.io/part-of: rack-insight
data:
  nginx.conf: |
    events {}
    http {
      server {
        listen 443 ssl;
        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        location / {
          # EDIT ME: point at your in-cluster Redfish endpoint (Service DNS).
          proxy_pass https://REDFISH_UPSTREAM_PLACEHOLDER;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redfish-proxy
  labels:
    app.kubernetes.io/name: redfish-proxy
    app.kubernetes.io/part-of: rack-insight
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redfish-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redfish-proxy
    spec:
      containers:
        - name: redfish-proxy
          image: nginx:1.27-alpine
          ports:
            - containerPort: 443
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: redfish-proxy-nginx
        - name: tls
          secret:
            secretName: redfish-proxy-tls
---
apiVersion: v1
kind: Service
metadata:
  name: redfish-proxy
  labels:
    app.kubernetes.io/name: redfish-proxy
    app.kubernetes.io/part-of: rack-insight
spec:
  selector:
    app.kubernetes.io/name: redfish-proxy
  ports:
    - name: https
      port: 443
      targetPort: 443
