# Rack Insight — runtime compose file (air-gap friendly).
#
# This file references pre-built images only (no build:), so
# `docker compose up -d` works with zero internet access once the images
# have been loaded via `docker load` (see README "Offline Deployment").
#
# To build the images on an internet-connected machine, use the override:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rackinsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rackinsight}
      POSTGRES_DB: ${POSTGRES_DB:-rackinsight}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-rackinsight}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    image: ${IMAGE_PREFIX:-rack-insight}-backend:${IMAGE_TAG:-1.3.0}
    # Applies Alembic migrations automatically on startup (upgrade head),
    # so the schema is always in sync with the running code version.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rackinsight}:${POSTGRES_PASSWORD:-rackinsight}@postgres:5432/${POSTGRES_DB:-rackinsight}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0RPYS0nOu5f5xkbXi3wYlLYasNci4RMOtayEqUKmyNI=}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123!}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${IMAGE_PREFIX:-rack-insight}-frontend:${IMAGE_TAG:-1.3.0}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
