# Build override — used ONLY on an internet-connected machine.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build
#
# The runtime docker-compose.yml is image-only so the air-gapped host never
# attempts a build (and therefore never needs pip/npm/registry access).
services:
  backend:
    build: ./backend

  frontend:
    build: ./frontend

  example-plugin:
    build: ./plugins/example-plugin
